<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <!-- Ambient shadow for a premium modern feel -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>
  
  <!-- Rounded square canvas simulating an app icon -->
  <rect width="512" height="512" rx="112" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Main Styled QR Code Logo -->
  <g transform="translate(64, 64) scale(16)">
    <!-- Main outer frame (24x24 pixel grid base, scaled up) -->
    <!-- Corner Outer Frames -->
    <rect x="3" y="3" width="6" height="6" rx="1.5" stroke="url(#grad)" stroke-width="1.8" fill="none" />
    <rect x="15" y="3" width="6" height="6" rx="1.5" stroke="url(#grad)" stroke-width="1.8" fill="none" />
    <rect x="3" y="15" width="6" height="6" rx="1.5" stroke="url(#grad)" stroke-width="1.8" fill="none" />
    
    <!-- Corner Inner Cores -->
    <rect x="5" y="5" width="2" height="2" rx="0.5" fill="url(#grad)" />
    <rect x="17" y="5" width="2" height="2" rx="0.5" fill="url(#grad)" />
    <rect x="5" y="17" width="2" height="2" rx="0.5" fill="url(#grad)" />
    
    <!-- Styled QR Dots & Data Patterns (flowing design) -->
    <circle cx="11" cy="4" r="0.9" fill="url(#grad)" />
    <circle cx="13" cy="5" r="0.9" fill="url(#grad)" />
    <circle cx="10" cy="7" r="0.9" fill="url(#grad)" />
    
    <circle cx="4" cy="11" r="0.9" fill="url(#grad)" />
    <circle cx="5" cy="13" r="0.9" fill="url(#grad)" />
    <circle cx="7" cy="10" r="0.9" fill="url(#grad)" />
    
    <circle cx="11" cy="11" r="1.1" fill="url(#grad)" />
    <circle cx="13" cy="13" r="0.9" fill="url(#grad)" />
    
    <rect x="15" y="10" width="2" height="2" rx="0.6" fill="url(#grad)" />
    <rect x="18" y="11" width="2" height="1.2" rx="0.4" fill="url(#grad)" />
    <rect x="10" y="15" width="2" height="2" rx="0.6" fill="url(#grad)" />
    <rect x="11" y="18" width="1.2" height="2" rx="0.4" fill="url(#grad)" />
    
    <!-- Bottom right custom details (resembling typical custom QR structures) -->
    <rect x="15" y="15" width="3" height="3" rx="0.8" fill="url(#grad)" />
    <rect x="19" y="15" width="1.5" height="1.5" rx="0.4" fill="url(#grad)" />
    <rect x="15" y="19" width="1.5" height="1.5" rx="0.4" fill="url(#grad)" />
    <rect x="18" y="18" width="2.2" height="2.2" rx="0.6" fill="url(#grad)" />
  </g>
</svg>
