<!-- Qrcode: three QR finder patterns and a few data modules. Drawn in a 128 box; `currentColor` is replaced by the build script. -->
<g stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <rect x="12" y="12" width="36" height="36" rx="8"/>
  <rect x="80" y="12" width="36" height="36" rx="8"/>
  <rect x="12" y="80" width="36" height="36" rx="8"/>
</g>
<g fill="currentColor">
  <rect x="24" y="24" width="12" height="12" rx="3"/>
  <rect x="92" y="24" width="12" height="12" rx="3"/>
  <rect x="24" y="92" width="12" height="12" rx="3"/>
  <rect x="80" y="80" width="14" height="14" rx="3"/>
  <rect x="102" y="80" width="14" height="14" rx="3"/>
  <rect x="80" y="102" width="14" height="14" rx="3"/>
  <rect x="102" y="102" width="14" height="14" rx="3" opacity="0.7"/>
</g>
